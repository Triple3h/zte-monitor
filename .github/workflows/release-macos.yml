name: Release macOS (ZTE Monitor)

on:
  push:
    branches: [main, master]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'build.sh'
      - 'VERSION'
      - '.github/workflows/release-macos.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS App
        run: |
          swift build -c release -Xswiftc -strict-concurrency=minimal
          APP_DIR="ZTE Monitor.app"
          MACOS_DIR="$APP_DIR/Contents/MacOS"
          RESOURCES_DIR="$APP_DIR/Contents/Resources"
          rm -rf "$APP_DIR"
          mkdir -p "$MACOS_DIR"
          mkdir -p "$RESOURCES_DIR"
          cp .build/release/F50Monitor "$MACOS_DIR/F50Monitor"
          if [ -f "Sources/F50Monitor/AppIcon.icns" ]; then
              cp Sources/F50Monitor/AppIcon.icns "$RESOURCES_DIR/AppIcon.icns"
          fi
          for logo in Sources/F50Monitor/China*Logo.svg Sources/F50Monitor/China*Logo.png; do
              [ -f "$logo" ] || continue
              cp "$logo" "$RESOURCES_DIR/$(basename "$logo")"
          done

          # 版本号：tag 构建以 tag 为准（并与 VERSION 真源校验一致），分支构建沿用 VERSION
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
              VERSION="$FILE_VERSION"
          elif [ "$VERSION" != "$FILE_VERSION" ]; then
              echo "❌ tag 版本（${VERSION}）与 VERSION 文件（${FILE_VERSION}）不一致，请先执行 ./scripts/bump-version.sh ${VERSION}"
              exit 1
          fi
          echo "🏷️  构建版本：$VERSION"

          cat << EOF > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>F50Monitor</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.f50.monitor</string>
              <key>CFBundleName</key>
              <string>ZTE Monitor</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          chmod +x "$MACOS_DIR/F50Monitor"
          codesign --force --sign - --timestamp=none "$APP_DIR"

          ditto -c -k --keepParent "ZTE Monitor.app" zte-monitor-macos.zip
          cp zte-monitor-macos.zip ZTE.Monitor.zip

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Monitor-macOS
          if-no-files-found: ignore
          path: |
            zte-monitor-macos.zip
            ZTE.Monitor.zip

      - name: Release App (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ZTE Monitor ${{ github.ref_name }}
          files: |
            zte-monitor-macos.zip
            ZTE.Monitor.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
