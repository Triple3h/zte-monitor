name: Release Windows (ZTE Monitor)

on:
  push:
    branches: [main, master]
    paths:
      - 'windows/**'
      - 'VERSION'
      - '.github/workflows/release-windows.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Version Consistency
        shell: bash
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          CARGO_VERSION="$(grep -m1 '^version = ' windows/src-tauri/Cargo.toml | cut -d'"' -f2)"
          PKG_VERSION="$(grep -m1 '"version"' windows/package.json | cut -d'"' -f4)"
          echo "VERSION=$FILE_VERSION Cargo.toml=$CARGO_VERSION package.json=$PKG_VERSION"
          if [ "$CARGO_VERSION" != "$FILE_VERSION" ] || [ "$PKG_VERSION" != "$FILE_VERSION" ]; then
            echo "❌ 版本号不一致，请执行 ./scripts/bump-version.sh $FILE_VERSION 后提交。"
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == v* ]] && [ "${GITHUB_REF_NAME#v}" != "$FILE_VERSION" ]; then
            echo "❌ tag 版本（${GITHUB_REF_NAME#v}）与 VERSION（${FILE_VERSION}）不一致。"
            exit 1
          fi
          echo "🏷️  版本号校验通过：$FILE_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'windows/package-lock.json'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'windows/src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install Frontend Dependencies
        working-directory: ./windows
        run: npm install

      - name: Build Tauri Windows App (${{ matrix.arch }})
        working-directory: ./windows
        run: npm run tauri build -- --no-bundle --target ${{ matrix.target }}

      - name: Prepare Named Binaries
        shell: bash
        run: |
          cp windows/src-tauri/target/${{ matrix.target }}/release/zte-monitor.exe zte-monitor-windows-${{ matrix.arch }}.exe

      - name: Upload Windows Artifacts (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Monitor-Windows-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            zte-monitor-windows-${{ matrix.arch }}.exe

      - name: Release App (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ZTE Monitor ${{ github.ref_name }}
          files: |
            zte-monitor-windows-${{ matrix.arch }}.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

